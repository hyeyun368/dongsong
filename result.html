<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘 저녁 메뉴</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>오늘 저녁은</h1>
    <div class="row">
      <span id="menu" class="menu"></span>
      <button class="secondary" onclick="pick()">내취향 아님</button>
    </div>
    <a href="index.html">처음으로</a>
  </div>

  <script>
    const menus = ['햄버거', '치킨', '볶음밥', '피자', '떡볶이', '샐러드', '국밥', '도시락', '미역국'];
    const menuEl = document.getElementById('menu');

    function pick() {
      // 방금 나온 메뉴는 제외하고 다시 뽑기
      const choices = menus.filter(m => m !== menuEl.textContent);
      menuEl.textContent = choices[Math.floor(Math.random() * choices.length)];
    }

    pick();
  </script>
</body>
</html>
